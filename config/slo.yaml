service: day13-observability-lab
window: 28d
measurement_source: data/logs.jsonl and /metrics
slis:
  latency_p95_ms:
    objective: 3000
    target: 99.5
    comparator: lte
    note: "At least 99.5% of five-minute windows must have P95 API latency at or below 3,000 ms."
  error_rate_pct:
    objective: 2
    target: 99.0
    comparator: lte
    note: "Failed chat requests divided by received chat requests must remain at or below 2%."
  daily_cost_usd:
    objective: 2.5
    target: 100.0
    comparator: lte
    note: "Cumulative cost must remain at or below USD 2.50 per UTC day."
  quality_score_avg:
    objective: 0.75
    target: 95.0
    comparator: gte
    note: "The response-quality proxy must average at least 0.75."
